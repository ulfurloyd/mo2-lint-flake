name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: |
          nix fmt
          git diff --exit-code
      - run: nix flake check -L
      - run: nix build .#mo2-lint -L
      - run: nix build .#mo2-redirector -L
      - run: nix build .#mo2-redirector --rebuild -L

  latest-nixpkgs:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake update nixpkgs
      - run: nix flake check -L
      - run: nix build .#mo2-redirector -L && nix build .#mo2-redirector --rebuild -L
